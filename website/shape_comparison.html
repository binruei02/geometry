<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="app-mode.js"></script>
    <title>3D 立體圖形實驗室 (3D Geometry Lab)</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        input[type=range] {
            accent-color: #4f46e5;
        }
        .noselect {
            user-select: none;
            -webkit-user-select: none;
        }
        /* 游標樣式優化 */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
        .cursor-move-item { cursor: move; }      
        .cursor-ns-resize { cursor: ns-resize; } 
        .cursor-rotate { cursor: alias; } 
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .mix-multiply {
            mix-blend-mode: multiply;
        }
        
        /* 移除輸入框的上下箭頭，讓介面更乾淨 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
<body class="bg-slate-950 w-full h-full overflow-hidden flex flex-col font-sans select-none">

    <div id="root" class="w-full h-full flex flex-col overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- 圖示組件 ---
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        
        // 形體圖示 (Shapes Icons)
        const IconCube = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
        const IconPyramid = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2 2 22h20L12 2Z" /><path d="m2 22 10-5 10 5" /></svg>;
        const IconCylinder = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 5v14c0 1.66-4 3-9 3s-9-1.34-9-3V5" /></svg>;
        const IconCone = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m20.9 18.55-8-15.98a1 1 0 0 0-1.8 0l-8 15.98" /><ellipse cx="12" cy="19" rx="9" ry="3" /></svg>;
        const IconSphere = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;

        const IconMovePlanar = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>;
        const IconMoveVertical = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/><path d="m5 12 7 7 7-7"/></svg>; 
        const IconRotate3D = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>;
        const IconHand = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconStack = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/><path d="m2 7 10 5 10-5"/><path d="M12 22V7"/></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconPan = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>; 
        const IconCoords = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/><circle cx="12" cy="12" r="1"/></svg>;
        const IconPalette = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>;
        const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;

        // --- 雙語名稱對照表 (Bilingual Names) ---
        const SHAPE_NAMES = {
            prism: '角柱 (Prism)',
            pyramid: '角錐 (Pyramid)',
            cylinder: '圓柱 (Cylinder)',
            cone: '圓錐 (Cone)',
            sphere: '球體 (Sphere)'
        };

        // --- 預設參數 (單位：公分 cm) ---
        const DEFAULT_PARAMS = {
            prism: { type: 'prism', sides: 4, baseSize: 5, height: 10, y: 0 },
            pyramid: { type: 'pyramid', sides: 4, baseSize: 5, height: 12, y: 0 },
            cylinder: { type: 'cylinder', sides: 32, baseSize: 5, height: 10, y: 0 },
            cone: { type: 'cone', sides: 32, baseSize: 5, height: 12, y: 0 },
            sphere: { type: 'sphere', sides: 24, baseSize: 5, height: 0, y: 0 }
        };

        // --- 顏色調色盤 (淡彩色系 - Bilingual) ---
        const PASTEL_COLORS = [
            { hue: 350, name: '櫻花粉 (Pink)', bg: '#fecdd3' }, 
            { hue: 30,  name: '蜜桃橘 (Orange)', bg: '#fed7aa' }, 
            { hue: 50,  name: '檸檬黃 (Yellow)', bg: '#fef08a' }, 
            { hue: 150, name: '薄荷綠 (Green)', bg: '#bbf7d0' }, 
            { hue: 200, name: '天空藍 (Blue)', bg: '#bae6fd' }, 
            { hue: 270, name: '薰衣草 (Purple)', bg: '#ddd6fe' }, 
            { hue: 0,   name: '中性灰 (Gray)', bg: '#e2e8f0', sat: 0 }, 
        ];

        const GeometryLab = () => {
            // 比例尺：1 cm = 10 像素
            const UNIT_SCALE = 10; 

            const [shapes, setShapes] = useState([
                { id: 1, x: 0, z: 0, colorHue: 200, ...DEFAULT_PARAMS.cylinder }
            ]);
            const [selectedShapeId, setSelectedShapeId] = useState(1);
            
            // --- 國小五下：立體圖形互動檢核任務狀態 ---
            const [quizOpen, setQuizOpen] = useState(true);
            const [quizStep, setQuizStep] = useState(0); 
            // 0: 柱體底面點選 (點選 2 個底面)
            // 1: 柱體側面形狀檢核 (長方形)
            // 2: 圓柱側面特性 (曲面，展開為長方形)
            // 3: 錐體底面點選 (只有 1 個底面)
            // 4: 錐體側面形狀 (角錐側面三角形，圓錐展開扇形)
            // 5: 完成挑戰
            const [clickedBases, setClickedBases] = useState([]); // ['top', 'bottom']
            const [quizFeedback, setQuizFeedback] = useState(null);
            const [quizCompleted, setQuizCompleted] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 768);
            const [addShapeSelectVal, setAddShapeSelectVal] = useState("");

            // --- 底部工具列滑動引導與按鈕狀態 ---
            const toolbarRef = useRef(null);
            const [toolbarCanScrollRight, setToolbarCanScrollRight] = useState(() => typeof window !== 'undefined' && window.innerWidth < 850);
            const [toolbarCanScrollLeft, setToolbarCanScrollLeft] = useState(false);

            const checkToolbarScroll = useCallback(() => {
                const el = toolbarRef.current;
                if (!el) return;
                const hasScroll = el.scrollWidth > el.clientWidth + 4;
                if (!hasScroll) {
                    setToolbarCanScrollRight(false);
                    setToolbarCanScrollLeft(false);
                    return;
                }
                const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 8;
                const atStart = el.scrollLeft <= 5;
                setToolbarCanScrollRight(!atEnd);
                setToolbarCanScrollLeft(!atStart);
            }, []);

            useEffect(() => {
                const timer = setTimeout(checkToolbarScroll, 100);
                window.addEventListener('resize', checkToolbarScroll);
                return () => {
                    clearTimeout(timer);
                    window.removeEventListener('resize', checkToolbarScroll);
                };
            }, [checkToolbarScroll, quizStep, selectedShapeId]);

            useEffect(() => {
                const checkFs = () => {
                    const parentDoc = (window.parent && window.parent !== window) ? window.parent.document : null;
                    const isFs = !!(
                        document.fullscreenElement || 
                        document.webkitFullscreenElement ||
                        (parentDoc && (parentDoc.fullscreenElement || parentDoc.webkitFullscreenElement))
                    );
                    setIsFullscreen(isFs);
                };
                document.addEventListener('fullscreenchange', checkFs);
                document.addEventListener('webkitfullscreenchange', checkFs);
                try {
                    window.parent?.document?.addEventListener('fullscreenchange', checkFs);
                    window.parent?.document?.addEventListener('webkitfullscreenchange', checkFs);
                } catch(e) {}

                const handleMsg = (e) => {
                    if (e.data && e.data.type === 'FULLSCREEN_CHANGED') {
                        setIsFullscreen(!!e.data.isFullscreen);
                    }
                };
                window.addEventListener('message', handleMsg);

                checkFs();
                return () => {
                    document.removeEventListener('fullscreenchange', checkFs);
                    document.removeEventListener('webkitfullscreenchange', checkFs);
                    try {
                        window.parent?.document?.removeEventListener('fullscreenchange', checkFs);
                        window.parent?.document?.removeEventListener('webkitfullscreenchange', checkFs);
                    } catch(e) {}
                    window.removeEventListener('message', handleMsg);
                };
            }, []);

            const [progress, setProgress] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('geo5-progress-v1') || '{"done":[],"best":null}');
                } catch(e) {
                    return { done: [], best: null };
                }
            });

            // 監聽原生全螢幕變化事件，同步更新狀態
            useEffect(() => {
                const onFsChange = () => {
                    const hasFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    setIsFullscreen(hasFs);
                };
                document.addEventListener('fullscreenchange', onFsChange);
                document.addEventListener('webkitfullscreenchange', onFsChange);
                return () => {
                    document.removeEventListener('fullscreenchange', onFsChange);
                    document.removeEventListener('webkitfullscreenchange', onFsChange);
                };
            }, []);

            const toggleFullscreen = () => {
                const isFs = isFullscreen || !!(document.fullscreenElement || document.webkitFullscreenElement);

                if (!isFs) {
                    // 1. 同步切換 CSS 滿版沉浸全螢幕 (保證手機 Chrome / iOS Safari 第一時間 100% 滿版無干擾)
                    setIsFullscreen(true);
                    // 2. 嘗試呼叫瀏覽器原生全螢幕
                    try {
                        const el = document.documentElement;
                        const req = el.requestFullscreen || el.webkitRequestFullscreen;
                        if (req) {
                            const p = req.call(el);
                            if (p && p.catch) p.catch(() => {});
                        }
                    } catch(e) {}
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: "ENTER_FULLSCREEN" }, "*");
                        }
                    } catch(e) {}
                    // 3. 在 iOS 瀏覽器中且未安裝為獨立 App，彈出 App 模式引導
                    if (window.isIOSDevice && window.isIOSDevice() && !window.isRunningStandalone()) {
                        window.showAppModeGuide && window.showAppModeGuide('以 App 模式開啟 100% 全螢幕');
                    }
                } else {
                    setIsFullscreen(false);
                    try {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
                            const p = exit.call(document);
                            if (p && p.catch) p.catch(() => {});
                        }
                    } catch(e) {}
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: "EXIT_FULLSCREEN" }, "*");
                        }
                    } catch(e) {}
                }
            };
            // iPad 兩指縮放手勢參照
            const pinchRef = useRef({ dist: 0, scale: 1 });

            // 面的互動點擊檢核
            const handleFaceClick = (poly, e) => {
                e && e.stopPropagation();
                setSelectedShapeId(poly.shapeId);

                // 任務 0：柱體點選 2 個底面
                if (quizStep === 0) {
                    if (poly.partType === 'top' || poly.partType === 'bottom') {
                        if (!clickedBases.includes(poly.partType)) {
                            const newBases = [...clickedBases, poly.partType];
                            setClickedBases(newBases);
                            if (newBases.length === 2) {
                                setQuizFeedback({
                                    ok: true,
                                    msg: '太棒了！你找到了柱體的 2 個底面！這兩個底面完全全等而且互相平行。'
                                });
                            } else {
                                setQuizFeedback({
                                    ok: true,
                                    msg: `找到了 1 個底面（${poly.partType === 'top' ? '上底面' : '下底面'}）！旋轉視角再點選另一個底面！`
                                });
                            }
                        }
                    } else if (poly.partType === 'side') {
                        setQuizFeedback({
                            ok: false,
                            msg: '這是側面喔！請找找看上下兩個互相平行的「底面」在哪裡！'
                        });
                    }
                } 
                // 任務 1：錐體點選 1 個底面
                else if (quizStep === 1) {
                    if (poly.partType === 'bottom') {
                        setClickedBases(['bottom']);
                        setQuizFeedback({
                            ok: true,
                            msg: '答對了！這就是錐體的底面。請記住：錐體只有 1 個底面，尖端只有 1 個頂點（錐頂）！'
                        });
                    } else if (poly.partType === 'side') {
                        setQuizFeedback({
                            ok: false,
                            msg: '這是角錐傾斜的側面，請點選最下方的「底面」！'
                        });
                    }
                }
            };
            
            // 視圖與互動模式 
            const [interactionMode, setInteractionMode] = useState('moveItem'); 
            const [view, setView] = useState({ x: 0, y: 0, scale: 1 }); 
            const [userRotation, setUserRotation] = useState({ x: 25 * (Math.PI / 180), y: 30 * (Math.PI / 180) }); 
            const [autoRotate, setAutoRotate] = useState(false);

            // 自動自轉動畫循環
            useEffect(() => {
                if (!autoRotate) return;
                let animId;
                const loop = () => {
                    setUserRotation(prev => ({
                        ...prev,
                        y: (prev.y + 0.015) % (Math.PI * 2)
                    }));
                    animId = requestAnimationFrame(loop);
                };
                animId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(animId);
            }, [autoRotate]);

            // --- 根據小檢核任務直接出現對應的 3D 物件與最佳視角 ---
            const setupShapesForStep = (step) => {
                setQuizStep(step);
                setClickedBases([]);
                setQuizFeedback(null);
                setAutoRotate(false);

                if (step === 0) {
                    // 任務 1：柱體底面 (三角柱，方便觀察辨認 2 個底面，置於可視區中央)
                    const newId = 101;
                    const rx = 28 * (Math.PI / 180);
                    const ry = 35 * (Math.PI / 180);
                    setShapes([
                        { id: newId, x: 0, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 200, ...DEFAULT_PARAMS.prism, sides: 3, baseSize: 6, height: 10 }
                    ]);
                    setSelectedShapeId(newId);
                    setUserRotation({ x: rx, y: ry });
                    setView({ x: 0, y: 0, scale: 1 });
                } else if (step === 1) {
                    // 任務 2：錐體底面 (四角錐，置於可視區中央)
                    const newId = 102;
                    const rx = 25 * (Math.PI / 180);
                    const ry = 40 * (Math.PI / 180);
                    setShapes([
                        { id: newId, x: 0, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 30, ...DEFAULT_PARAMS.pyramid, sides: 4, baseSize: 6, height: 11 }
                    ]);
                    setSelectedShapeId(newId);
                    setUserRotation({ x: rx, y: ry });
                    setView({ x: 0, y: 0, scale: 1 });
                } else if (step === 2) {
                    // 任務 3：五角柱與五角錐頂點邊數 (均勻並列於畫面左右)
                    const id1 = 103;
                    const id2 = 104;
                    const rx = 22 * (Math.PI / 180);
                    const ry = 30 * (Math.PI / 180);
                    setShapes([
                        { id: id1, x: -14, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 270, ...DEFAULT_PARAMS.prism, sides: 5, baseSize: 5, height: 10 },
                        { id: id2, x: 14, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 150, ...DEFAULT_PARAMS.pyramid, sides: 5, baseSize: 5, height: 11 }
                    ]);
                    setSelectedShapeId(id1);
                    setUserRotation({ x: rx, y: ry });
                    setView({ x: 0, y: 0, scale: 1 });
                } else if (step === 3) {
                    // 任務 4：表面特性（圓柱與圓錐，均勻並列於畫面左右）
                    const id1 = 105;
                    const id2 = 106;
                    const rx = 20 * (Math.PI / 180);
                    const ry = 30 * (Math.PI / 180);
                    setShapes([
                        { id: id1, x: -14, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 200, ...DEFAULT_PARAMS.cylinder, sides: 32, baseSize: 5, height: 10 },
                        { id: id2, x: 14, y: 0, z: 0, rotX: rx, rotY: ry, colorHue: 50, ...DEFAULT_PARAMS.cone, sides: 32, baseSize: 5, height: 11 }
                    ]);
                    setSelectedShapeId(id1);
                    setUserRotation({ x: rx, y: ry });
                    setView({ x: 0, y: 0, scale: 1 });
                }
            };

            // 首次載入自動配置任務 1 的形體
            useEffect(() => {
                setupShapesForStep(0);
            }, []);

            // --- iPad / 觸控專屬直覺視角與操作輔助 ---
            const setCameraPreset = (preset) => {
                setAutoRotate(false);
                if (preset === 'top') {
                    // 俯視：清楚看到上底面
                    const rx = 65 * (Math.PI / 180);
                    const ry = 30 * (Math.PI / 180);
                    setUserRotation({ x: rx, y: ry });
                    setShapes(prev => prev.map(s => (!selectedShapeId || s.id === selectedShapeId) ? { ...s, rotX: rx, rotY: ry } : s));
                } else if (preset === 'bottom') {
                    // 仰視：清楚看到下底面
                    const rx = -65 * (Math.PI / 180);
                    const ry = 30 * (Math.PI / 180);
                    setUserRotation({ x: rx, y: ry });
                    setShapes(prev => prev.map(s => (!selectedShapeId || s.id === selectedShapeId) ? { ...s, rotX: rx, rotY: ry } : s));
                } else if (preset === 'reset') {
                    const rx = 25 * (Math.PI / 180);
                    const ry = 30 * (Math.PI / 180);
                    setUserRotation({ x: rx, y: ry });
                    setShapes(prev => prev.map(s => ({ ...s, rotX: rx, rotY: ry })));
                    setView({ x: 0, y: 0, scale: 1 });
                }
            };

            // 依據畫面上的形體數量，將所有形體均勻排列在畫面上
            const arrangeShapes = () => {
                setView({ x: 0, y: 0, scale: 1 });
                setShapes(prev => {
                    const n = prev.length;
                    if (n === 0) return prev;
                    if (n === 1) {
                        return prev.map(s => ({ ...s, x: 0, y: 0, z: 0 }));
                    }
                    if (n === 2) {
                        return prev.map((s, i) => ({ ...s, x: i === 0 ? -14 : 14, y: 0, z: 0 }));
                    }
                    if (n === 3) {
                        return prev.map((s, i) => ({ ...s, x: (i - 1) * 20, y: 0, z: 0 }));
                    }
                    // 4 個以上分上下兩排均勻排列
                    const topCount = Math.ceil(n / 2);
                    const botCount = n - topCount;
                    return prev.map((s, i) => {
                        const isTop = i < topCount;
                        const rowIdx = isTop ? i : i - topCount;
                        const rowTotal = isTop ? topCount : botCount;
                        const spanX = Math.min(24, (rowTotal - 1) * 11);
                        const posX = rowTotal === 1 ? 0 : -spanX + (rowIdx * (2 * spanX)) / (rowTotal - 1);
                        const posY = isTop ? -10 : 10;
                        return { ...s, x: Math.round(posX * 10) / 10, y: posY, z: 0 };
                    });
                });
            };

            const resetShapePos = () => {
                if (!selectedShapeId) return;
                setShapes(prev => prev.map(s => s.id === selectedShapeId ? { ...s, x: 0, y: 0, z: 0 } : s));
            };

            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [viewStart, setViewStart] = useState({ x: 0, y: 0 });
            const [rotationStart, setRotationStart] = useState({ x: 0, y: 0 });
            const [shapeStartPos, setShapeStartPos] = useState({ x: 0, z: 0, y: 0 });
            const dragMovedRef = useRef(false);
            const activeDragShapeIdRef = useRef(null);

            const svgRef = useRef(null);

            // --- 3D 渲染常數 ---
            const CX = 400;
            const CY = 300;
            const FOCAL_LENGTH = 3500; 

            // --- 個別形體獨立 3D 旋轉 + 2D 畫面座標投影函數 (避免 3D 位移造成形體消失) ---
            const projectShape3D = (s, lx, ly, lz) => {
                const rx = s && s.rotX !== undefined ? s.rotX : userRotation.x;
                const ry = s && s.rotY !== undefined ? s.rotY : userRotation.y;

                const x1 = lx * Math.cos(ry) - lz * Math.sin(ry);
                const z1 = lx * Math.sin(ry) + lz * Math.cos(ry);
                
                const y2 = ly * Math.cos(rx) - z1 * Math.sin(rx);
                const z2 = ly * Math.sin(rx) + z1 * Math.cos(rx);
                
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + z2);
                const screenX = CX + ((s && s.x) || 0) * UNIT_SCALE;
                const screenY = CY + ((s && s.y) || 0) * UNIT_SCALE;
                
                return { 
                    x: screenX + x1 * scale, 
                    y: screenY + y2 * scale, 
                    z: z2,
                    scale: scale 
                };
            };

            // --- 投影函數 (供背景格線座標軸使用) ---
            const project3D = (x, y, z) => {
                let x1 = x * Math.cos(userRotation.y) - z * Math.sin(userRotation.y);
                let z1 = x * Math.sin(userRotation.y) + z * Math.cos(userRotation.y);
                
                let y2 = y * Math.cos(userRotation.x) - z1 * Math.sin(userRotation.x);
                let z2 = y * Math.sin(userRotation.x) + z1 * Math.cos(userRotation.x);
                
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + z2); 
                
                return { 
                    x: CX + x1 * scale, 
                    y: CY + y2 * scale, 
                    z: z2,
                    scale: scale 
                };
            };

            // --- 形體操作 ---
            const addShape = (type) => {
                const newId = Date.now();
                const rx = 25 * (Math.PI / 180);
                const ry = 30 * (Math.PI / 180);
                setShapes(prev => {
                    const nextList = [
                        ...prev,
                        {
                            id: newId,
                            x: 0,
                            y: 0,
                            z: 0,
                            rotX: rx,
                            rotY: ry,
                            colorHue: PASTEL_COLORS[Math.floor(Math.random() * 6)].hue,
                            ...DEFAULT_PARAMS[type]
                        }
                    ];
                    const n = nextList.length;
                    if (n === 1) return nextList.map(s => ({ ...s, x: 0, y: 0 }));
                    if (n === 2) return nextList.map((s, i) => ({ ...s, x: i === 0 ? -14 : 14, y: 0 }));
                    if (n === 3) return nextList.map((s, i) => ({ ...s, x: (i - 1) * 20, y: 0 }));
                    const topCount = Math.ceil(n / 2);
                    const botCount = n - topCount;
                    return nextList.map((s, i) => {
                        const isTop = i < topCount;
                        const rowIdx = isTop ? i : i - topCount;
                        const rowTotal = isTop ? topCount : botCount;
                        const spanX = Math.min(24, (rowTotal - 1) * 11);
                        const posX = rowTotal === 1 ? 0 : -spanX + (rowIdx * (2 * spanX)) / (rowTotal - 1);
                        const posY = isTop ? -10 : 10;
                        return { ...s, x: Math.round(posX * 10) / 10, y: posY };
                    });
                });
                setSelectedShapeId(newId);
            };

            const removeShape = (id, e) => {
                e && e.stopPropagation();
                const newShapes = shapes.filter(s => s.id !== id);
                setShapes(newShapes);
                if (selectedShapeId === id) {
                    setSelectedShapeId(newShapes.length > 0 ? newShapes[0].id : null);
                }
            };

            // 複製形體
            const duplicateShape = (e) => {
                e.stopPropagation();
                if (!selectedShapeId) return;

                const original = shapes.find(s => s.id === selectedShapeId);
                if (!original) return;

                const newId = Date.now();
                const newShape = {
                    ...original,
                    id: newId,
                    x: Math.max(-28, Math.min(28, (original.x || 0) + 6)),
                    y: Math.max(-18, Math.min(18, (original.y || 0) + 4))
                };

                setShapes([...shapes, newShape]);
                setSelectedShapeId(newId);
            };

            const updateSelectedShape = (key, value) => {
                setShapes(prev => prev.map(s => s.id === selectedShapeId ? { ...s, [key]: value } : s));
            };

            const resetView = () => {
                const rx = 25 * (Math.PI / 180);
                const ry = 30 * (Math.PI / 180);
                setView({ x: 0, y: 0, scale: 1 });
                setUserRotation({ x: rx, y: ry });
                setShapes(prev => prev.map(s => ({ ...s, rotX: rx, rotY: ry })));
            };

            // 啟動指定形體或當前選取形體的拖曳/旋轉手勢
            const startPointerAction = (clientX, clientY, targetShapeId = null) => {
                const activeId = targetShapeId || selectedShapeId || (shapes[0] && shapes[0].id);
                if (targetShapeId && targetShapeId !== selectedShapeId) {
                    setSelectedShapeId(targetShapeId);
                }
                activeDragShapeIdRef.current = activeId;
                dragMovedRef.current = false;
                setIsDragging(true);
                setDragStart({ x: clientX, y: clientY });
                setViewStart({ ...view });

                const targetShape = shapes.find(s => s.id === activeId);
                if (targetShape) {
                    setShapeStartPos({ x: targetShape.x || 0, y: targetShape.y || 0, z: targetShape.z || 0 });
                    setRotationStart({
                        x: targetShape.rotX !== undefined ? targetShape.rotX : userRotation.x,
                        y: targetShape.rotY !== undefined ? targetShape.rotY : userRotation.y
                    });
                } else {
                    setRotationStart({ ...userRotation });
                }
            };

            const applyPointerMove = (clientX, clientY) => {
                if (!isDragging) return;
                const dx = clientX - dragStart.x;
                const dy = clientY - dragStart.y;
                if (Math.hypot(dx, dy) > 5) {
                    dragMovedRef.current = true;
                }

                const targetId = activeDragShapeIdRef.current || selectedShapeId;
                if (!targetId) return;

                if (interactionMode === 'moveItem') {
                    // 2D 畫面平面直覺拖曳位置，並限制在畫布安全可視範圍內，絕不消失
                    const svgEl = svgRef.current;
                    const rect = svgEl ? svgEl.getBoundingClientRect() : { width: 800, height: 600 };
                    const svgScale = Math.min(rect.width / 800, rect.height / 600) * (view.scale || 1);
                    const deltaXCm = (dx / (svgScale || 1)) / UNIT_SCALE;
                    const deltaYCm = (dy / (svgScale || 1)) / UNIT_SCALE;

                    const clampedX = Math.max(-30, Math.min(30, shapeStartPos.x + deltaXCm));
                    const clampedY = Math.max(-18, Math.min(18, shapeStartPos.y + deltaYCm));

                    setShapes(prev => prev.map(s => s.id === targetId ? { ...s, x: clampedX, y: clampedY } : s));
                } else if (interactionMode === 'rotate') {
                    // 點選物件後：上下拖拉 = 上下旋轉物件 (rotX)，左右拖拉 = 左右旋轉物件 (rotY)
                    const ROTATION_SPEED = 0.008;
                    const newRotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotationStart.x + dy * ROTATION_SPEED));
                    const newRotY = rotationStart.y - dx * ROTATION_SPEED;

                    setShapes(prev => prev.map(s => s.id === targetId ? { ...s, rotX: newRotX, rotY: newRotY } : s));
                }
            };

            // --- 互動事件處理 ---
            const handleMouseDown = (e) => {
                if (e.button !== 0) return;
                startPointerAction(e.clientX, e.clientY, null);
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                applyPointerMove(e.clientX, e.clientY);
            };

            const handleMouseUp = () => {
                setIsDragging(false);
                activeDragShapeIdRef.current = null;
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const scaleAmount = -e.deltaY * 0.001;
                const newScale = Math.max(0.4, Math.min(view.scale + scaleAmount, 3)); 
                setView(prev => ({ ...prev, scale: newScale }));
            };
            
            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const t0 = e.touches[0];
                    const t1 = e.touches[1];
                    const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    pinchRef.current = { dist, scale: view.scale };
                } else if (e.touches.length === 1) {
                    startPointerAction(e.touches[0].clientX, e.touches[0].clientY, null);
                }
            };

            const handleTouchMove = (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const t0 = e.touches[0];
                    const t1 = e.touches[1];
                    const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    if (pinchRef.current.dist > 0) {
                        const factor = dist / pinchRef.current.dist;
                        const newScale = Math.max(0.4, Math.min(pinchRef.current.scale * factor, 3));
                        setView(v => ({ ...v, scale: newScale }));
                    }
                } else if (isDragging && e.touches.length === 1) {
                    applyPointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            };

            const handleTouchEnd = (e) => {
                if (e.touches && e.touches.length < 2) {
                    pinchRef.current.dist = 0;
                }
                handleMouseUp();
            };
            
            // --- 幾何生成 (局部中心座標以原點 (0,0,0) 為中心，再由 projectShape3D 獨立旋轉與 2D 畫面定位) ---
            const generateShapePolygons = (shape) => {
                const scale = UNIT_SCALE;
                const { id, type, sides, baseSize, height: heightCm, colorHue } = shape;
                
                const height = heightCm * scale;

                const isSmooth = type === 'cylinder' || type === 'cone' || type === 'sphere';
                const renderSides = isSmooth ? (type === 'sphere' ? 24 : 32) : sides;
                
                let radius;
                
                if (type === 'sphere') {
                    radius = baseSize * scale;
                } else if (isSmooth && type !== 'sphere') {
                    radius = baseSize * scale;
                } else {
                    const sideLengthPx = baseSize * scale;
                    radius = sideLengthPx / (2 * Math.sin(Math.PI / renderSides));
                }

                const polygons = [];
                const highlight = selectedShapeId === id;
                const strokeColor = highlight ? '#dc2626' : (colorHue === 0 ? '#334155' : `hsla(${colorHue}, 75%, 25%, 0.85)`); 
                const strokeWidth = highlight ? 2.5 : 1.5;
                
                const isGray = colorHue === 0 && shape.colorHue === 0; 
                const saturation = isGray ? '0%' : '85%';
                
                const baseFillColor = (lightness) => `hsla(${colorHue}, ${saturation}, ${lightness}%, 0.85)`; 

                // --- 1. 球體 (Sphere) ---
                if (type === 'sphere') {
                    const centerPoint = { x: 0, y: 0, z: 0 };
                    
                    polygons.push({
                        shapeId: id,
                        shapeRef: shape,
                        type: 'sphere',
                        center: centerPoint,
                        radius: radius,
                        color: baseFillColor(75),
                        stroke: strokeColor,
                        strokeWidth: strokeWidth,
                        highlight: highlight
                    });
                }
                
                // --- 2. 柱體 (Prism / Cylinder) ---
                else if (type === 'prism' || type === 'cylinder') {
                    const bottomY = height / 2;
                    const topY = -height / 2;
                    const bottomPts = [];
                    const topPts = [];

                    for(let i=0; i<renderSides; i++) {
                        const angle = (2 * Math.PI * i) / renderSides - Math.PI/2;
                        const x = radius * Math.cos(angle);
                        const z = radius * Math.sin(angle);
                        bottomPts.push({ x, y: bottomY, z });
                        topPts.push({ x, y: topY, z });
                    }

                    // 側面
                    for(let i=0; i<renderSides; i++) {
                        const next = (i + 1) % renderSides;
                        const faceLightness = 75 + (i % 2) * 5; 
                        polygons.push({
                            shapeId: id,
                            shapeRef: shape,
                            partType: 'side',
                            sideIndex: i,
                            points: [topPts[i], topPts[next], bottomPts[next], bottomPts[i]],
                            color: baseFillColor(faceLightness),
                            stroke: isSmooth ? 'none' : strokeColor,
                            strokeWidth: strokeWidth
                        });
                    }
                    // 頂底面
                    polygons.push({ shapeId: id, shapeRef: shape, partType: 'bottom', points: bottomPts, color: baseFillColor(65), stroke: isSmooth ? 'none' : strokeColor, strokeWidth });
                    polygons.push({ shapeId: id, shapeRef: shape, partType: 'top', points: topPts, color: baseFillColor(80), stroke: isSmooth ? 'none' : strokeColor, strokeWidth });
                }
                
                // --- 3. 錐體 (Pyramid / Cone) ---
                else if (type === 'pyramid' || type === 'cone') {
                    const bottomY = height / 2;
                    const apexY = -height / 2;
                    const apexPoint = { x: 0, y: apexY, z: 0 };
                    const bottomPts = [];

                    for(let i=0; i<renderSides; i++) {
                        const angle = (2 * Math.PI * i) / renderSides - Math.PI/2;
                        bottomPts.push({ x: radius * Math.cos(angle), y: bottomY, z: radius * Math.sin(angle) });
                    }

                    // 底面
                    polygons.push({ shapeId: id, shapeRef: shape, partType: 'bottom', points: bottomPts, color: baseFillColor(65), stroke: isSmooth ? 'none' : strokeColor, strokeWidth });

                    // 側面
                    for(let i=0; i<renderSides; i++) {
                        const next = (i + 1) % renderSides;
                        const faceLightness = 75 + (i % 2) * 5;
                        polygons.push({
                            shapeId: id,
                            shapeRef: shape,
                            partType: 'side',
                            sideIndex: i,
                            points: [bottomPts[i], bottomPts[next], apexPoint],
                            color: baseFillColor(faceLightness),
                            stroke: isSmooth ? 'none' : strokeColor,
                            strokeWidth: strokeWidth
                        });
                    }
                }

                return polygons;
            };

            const createPath = (points) => {
                if (!points || points.length === 0) return '';
                return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ') + ' Z';
            };

            // 渲染場景
            const renderScene = () => {
                let allPolys = shapes.flatMap(generateShapePolygons);

                const projectedPolys = allPolys.map(poly => {
                    const sRef = poly.shapeRef;
                    if (poly.type === 'sphere') {
                        const projCenter = projectShape3D(sRef, poly.center.x, poly.center.y, poly.center.z);
                        const projRadius = poly.radius * projCenter.scale;
                        
                        return {
                            ...poly,
                            projCenter,
                            projRadius,
                            zIndex: projCenter.z - poly.radius * 0.5 
                        };
                    } else {
                        const projPoints = poly.points.map(p => projectShape3D(sRef, p.x, p.y, p.z));
                        const zSum = projPoints.reduce((sum, p) => sum + p.z, 0);
                        const zAvg = zSum / projPoints.length;
                        return {
                            ...poly,
                            projPoints,
                            zIndex: zAvg
                        };
                    }
                });

                // Z-Sort
                projectedPolys.sort((a, b) => b.zIndex - a.zIndex);

                return projectedPolys.map((poly, index) => {
                    const onClick = (e) => {
                        if (!dragMovedRef.current) {
                            handleFaceClick(poly, e);
                        }
                    };
                    const onShapeMouseDown = (e) => {
                        if (e.button === 0) {
                            e.stopPropagation();
                            startPointerAction(e.clientX, e.clientY, poly.shapeId);
                        }
                    };
                    const onShapeTouchStart = (e) => {
                        if (e.touches && e.touches.length === 1) {
                            e.stopPropagation();
                            startPointerAction(e.touches[0].clientX, e.touches[0].clientY, poly.shapeId);
                        }
                    };

                    const style = {};

                    if (poly.type === 'sphere') {
                        return (
                            <g key={`sphere-${index}`} onClick={onClick} onMouseDown={onShapeMouseDown} onTouchStart={onShapeTouchStart} style={style}>
                                <circle 
                                    cx={poly.projCenter.x} 
                                    cy={poly.projCenter.y} 
                                    r={poly.projRadius} 
                                    fill={poly.color} 
                                    stroke={poly.stroke} 
                                    strokeWidth={poly.strokeWidth}
                                />
                                {poly.highlight && (
                                    <circle 
                                        cx={poly.projCenter.x} cy={poly.projCenter.y} r={poly.projRadius} 
                                        fill="none" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 4" 
                                    />
                                )}
                            </g>
                        );
                    } else {
                        // 檢核高亮邏輯
                        let fillColor = poly.color;
                        let strokeColor = poly.stroke;
                        let strokeWidth = poly.strokeWidth;

                        if (poly.partType && clickedBases.includes(poly.partType)) {
                            fillColor = 'rgba(245, 158, 11, 0.85)'; // 金黃底面高亮
                            strokeColor = '#b45309';
                            strokeWidth = 3;
                        } else if (quizStep === 1 && poly.partType === 'side') {
                            fillColor = 'rgba(14, 165, 233, 0.75)'; // 側面形狀展示高亮
                            strokeColor = '#0369a1';
                            strokeWidth = 2.5;
                        }

                        return (
                            <path 
                                key={`poly-${index}`}
                                d={createPath(poly.projPoints)}
                                fill={fillColor}
                                stroke={strokeColor}
                                strokeWidth={strokeWidth}
                                strokeLinejoin="round"
                                onClick={onClick}
                                onMouseDown={onShapeMouseDown}
                                onTouchStart={onShapeTouchStart}
                                style={style}
                                className="hover:opacity-90 transition-opacity cursor-pointer"
                            />
                        );
                    }
                });
            };

            const selectedShape = shapes.find(s => s.id === selectedShapeId);

            // 判斷當前游標樣式
            let cursorClass = '';
            if (interactionMode === 'moveItem') cursorClass = 'cursor-move-item';
            else if (interactionMode === 'liftItem') cursorClass = 'cursor-ns-resize';
            else if (interactionMode === 'rotate') cursorClass = 'cursor-rotate';
            else cursorClass = 'cursor-grab';
            
            if (isDragging) {
                if (interactionMode === 'pan') cursorClass = 'cursor-grabbing';
            }

            // 繪製形體側邊箭頭標註（頂點、邊、側面）
            const renderAnnotations = () => {
                return shapes.map((s) => {
                    if (s.type === 'sphere') return null;

                    const scale = UNIT_SCALE;
                    const height = s.height * scale;
                    const isSmooth = s.type === 'cylinder' || s.type === 'cone';
                    const renderSides = isSmooth ? 32 : s.sides;
                    const radius = isSmooth
                        ? s.baseSize * scale
                        : (s.baseSize * scale) / (2 * Math.sin(Math.PI / renderSides));

                    const bottomY = height / 2;
                    const topY = -height / 2;
                    const bottomPts = [];
                    const topPts = [];

                    for (let i = 0; i < renderSides; i++) {
                        const angle = (2 * Math.PI * i) / renderSides - Math.PI / 2;
                        const px = radius * Math.cos(angle);
                        const pz = radius * Math.sin(angle);
                        bottomPts.push(projectShape3D(s, px, bottomY, pz));
                        topPts.push(projectShape3D(s, px, topY, pz));
                    }
                    const apexPt = projectShape3D(s, 0, topY, 0);

                    const allPts = (s.type === 'prism' || s.type === 'cylinder')
                        ? [...bottomPts, ...topPts]
                        : [...bottomPts, apexPt];

                    const minX = Math.min(...allPts.map(p => p.x));
                    const maxX = Math.max(...allPts.map(p => p.x));
                    const maxY = Math.max(...allPts.map(p => p.y));
                    const centerX = (minX + maxX) / 2;

                    let shapeLabel = "";
                    if (s.type === "prism") shapeLabel = `${s.sides === 3 ? "三角柱" : s.sides === 4 ? "四角柱" : s.sides === 5 ? "五角柱" : s.sides + "角柱"}`;
                    else if (s.type === "pyramid") shapeLabel = `${s.sides === 3 ? "三角錐" : s.sides === 4 ? "四角錐" : s.sides === 5 ? "五角錐" : s.sides + "角錐"}`;
                    else if (s.type === "cylinder") shapeLabel = "圓柱";
                    else if (s.type === "cone") shapeLabel = "圓錐";

                    // 若場景有多個形體且此形體位於左側，主標註放左側；否則放右側
                    const sideDir = (shapes.length > 1 && s.x < 0) ? -1 : 1;

                    const callouts = [];
                    const highlightVertices = [];
                    const highlightEdges = [];

                    if (s.type === 'prism') {
                        let bestIdx = 0;
                        let bestVal = -Infinity;
                        topPts.forEach((p, i) => {
                            const val = p.x * sideDir;
                            if (val > bestVal) {
                                bestVal = val;
                                bestIdx = i;
                            }
                        });

                        const prevIdx = (bestIdx - 1 + renderSides) % renderSides;
                        const nextIdx = (bestIdx + 1) % renderSides;
                        const zPrev = (topPts[prevIdx].z + topPts[bestIdx].z + bottomPts[bestIdx].z + bottomPts[prevIdx].z) / 4;
                        const zNext = (topPts[bestIdx].z + topPts[nextIdx].z + bottomPts[nextIdx].z + bottomPts[bestIdx].z) / 4;
                        const otherIdx = zPrev < zNext ? prevIdx : nextIdx;

                        const vTop = topPts[bestIdx];
                        const vTopOther = topPts[otherIdx];
                        const vBot = bottomPts[bestIdx];
                        const vBotOther = bottomPts[otherIdx];

                        // 同時高亮：上底的邊、側面的邊、下底的邊
                        highlightEdges.push(
                            [vTop, vTopOther],
                            [vTop, vBot],
                            [vBot, vBotOther]
                        );

                        const topEdgeMid = {
                            x: (vTop.x + vTopOther.x) * 0.5,
                            y: (vTop.y + vTopOther.y) * 0.5
                        };
                        const sideEdgeMid = {
                            x: (vTop.x + vBot.x) * 0.5,
                            y: (vTop.y + vBot.y) * 0.5
                        };
                        const botEdgeMid = {
                            x: (vBot.x + vBotOther.x) * 0.5,
                            y: (vBot.y + vBotOther.y) * 0.5
                        };

                        // 另一側（-sideDir）標註「頂點」（同時指向上底頂點與下底頂點）與「側面」
                        let oppIdx = 0;
                        let oppVal = -Infinity;
                        topPts.forEach((p, i) => {
                            const val = p.x * (-sideDir);
                            if (val > oppVal) {
                                oppVal = val;
                                oppIdx = i;
                            }
                        });
                        const oppPrev = (oppIdx - 1 + renderSides) % renderSides;
                        const oppNext = (oppIdx + 1) % renderSides;
                        const zOppPrev = (topPts[oppPrev].z + topPts[oppIdx].z + bottomPts[oppIdx].z + bottomPts[oppPrev].z) / 4;
                        const zOppNext = (topPts[oppIdx].z + topPts[oppNext].z + bottomPts[oppNext].z + bottomPts[oppIdx].z) / 4;
                        const oppOther = zOppPrev < zOppNext ? oppPrev : oppNext;

                        const vTopVertex = topPts[oppIdx];
                        const vBotVertex = bottomPts[oppIdx];
                        highlightVertices.push(vTopVertex, vBotVertex);

                        const vertexAnchor = {
                            x: (vTopVertex.x + vBotVertex.x) * 0.5,
                            y: vTopVertex.y * 0.6 + vBotVertex.y * 0.4
                        };

                        const sideFacePt = {
                            x: topPts[oppOther].x * 0.15 + bottomPts[oppIdx].x * 0.25 + bottomPts[oppOther].x * 0.60,
                            y: Math.max(vBotVertex.y + 8, topPts[oppOther].y * 0.15 + bottomPts[oppIdx].y * 0.25 + bottomPts[oppOther].y * 0.60)
                        };

                        callouts.push(
                            { label: '頂點', dir: -sideDir, target: vertexAnchor, targets: [vTopVertex, vBotVertex], color: '#d97706', bg: '#fef3c7', textCol: '#92400e' },
                            { label: '邊', dir: sideDir, target: sideEdgeMid, targets: [topEdgeMid, sideEdgeMid, botEdgeMid], color: '#059669', bg: '#d1fae5', textCol: '#065f46' },
                            { label: '側面', dir: -sideDir, target: sideFacePt, targets: [sideFacePt], color: '#4f46e5', bg: '#e0e7ff', textCol: '#3730a3' }
                        );
                    } else if (s.type === 'pyramid') {
                        let bestIdx = 0;
                        let bestVal = -Infinity;
                        bottomPts.forEach((p, i) => {
                            const val = p.x * sideDir;
                            if (val > bestVal) {
                                bestVal = val;
                                bestIdx = i;
                            }
                        });

                        const prevIdx = (bestIdx - 1 + renderSides) % renderSides;
                        const nextIdx = (bestIdx + 1) % renderSides;
                        const zPrev = (apexPt.z + bottomPts[prevIdx].z + bottomPts[bestIdx].z) / 3;
                        const zNext = (apexPt.z + bottomPts[bestIdx].z + bottomPts[nextIdx].z) / 3;
                        const otherIdx = zPrev < zNext ? prevIdx : nextIdx;

                        const vBot = bottomPts[bestIdx];
                        const vBotOther = bottomPts[otherIdx];

                        // 同時高亮：錐體側面的邊、下底（底面）的邊
                        highlightEdges.push(
                            [apexPt, vBot],
                            [vBot, vBotOther]
                        );

                        const sideEdgeMid = {
                            x: apexPt.x * 0.5 + vBot.x * 0.5,
                            y: apexPt.y * 0.5 + vBot.y * 0.5
                        };
                        const botEdgeMid = {
                            x: (vBot.x + vBotOther.x) * 0.5,
                            y: (vBot.y + vBotOther.y) * 0.5
                        };
                        const edgeAnchor = {
                            x: (sideEdgeMid.x + botEdgeMid.x) * 0.5,
                            y: (sideEdgeMid.y + botEdgeMid.y) * 0.5
                        };

                        // 另一側（-sideDir）標註「頂點」（同時指向錐頂與下底頂點）與「側面」
                        let oppIdx = 0;
                        let oppVal = -Infinity;
                        bottomPts.forEach((p, i) => {
                            const val = p.x * (-sideDir);
                            if (val > oppVal) {
                                oppVal = val;
                                oppIdx = i;
                            }
                        });
                        const oppPrev = (oppIdx - 1 + renderSides) % renderSides;
                        const oppNext = (oppIdx + 1) % renderSides;
                        const zOppPrev = (apexPt.z + bottomPts[oppPrev].z + bottomPts[oppIdx].z) / 3;
                        const zOppNext = (apexPt.z + bottomPts[oppIdx].z + bottomPts[oppNext].z) / 3;
                        const oppOther = zOppPrev < zOppNext ? oppPrev : oppNext;

                        const vBotVertex = bottomPts[oppIdx];
                        highlightVertices.push(apexPt, vBotVertex);

                        const vertexAnchor = {
                            x: (apexPt.x + vBotVertex.x) * 0.5,
                            y: apexPt.y * 0.6 + vBotVertex.y * 0.4
                        };

                        const sideFacePt = {
                            x: apexPt.x * 0.15 + bottomPts[oppIdx].x * 0.25 + bottomPts[oppOther].x * 0.60,
                            y: Math.max(vBotVertex.y + 8, apexPt.y * 0.15 + bottomPts[oppIdx].y * 0.25 + bottomPts[oppOther].y * 0.60)
                        };

                        callouts.push(
                            { label: '頂點', dir: -sideDir, target: vertexAnchor, targets: [apexPt, vBotVertex], color: '#d97706', bg: '#fef3c7', textCol: '#92400e' },
                            { label: '邊', dir: sideDir, target: edgeAnchor, targets: [sideEdgeMid, botEdgeMid], color: '#059669', bg: '#d1fae5', textCol: '#065f46' },
                            { label: '側面', dir: -sideDir, target: sideFacePt, targets: [sideFacePt], color: '#4f46e5', bg: '#e0e7ff', textCol: '#3730a3' }
                        );
                    } else if (s.type === 'cylinder') {
                        let bestIdx = 0;
                        let bestVal = -Infinity;
                        topPts.forEach((p, i) => {
                            const val = p.x * sideDir;
                            if (val > bestVal) {
                                bestVal = val;
                                bestIdx = i;
                            }
                        });
                        const midCenter = projectShape3D(s, 0, (topY + bottomY) / 2, 0);
                        const sideFacePt = {
                            x: (topPts[bestIdx].x + bottomPts[bestIdx].x) * 0.38 + midCenter.x * 0.24,
                            y: (topPts[bestIdx].y + bottomPts[bestIdx].y) * 0.5
                        };
                        callouts.push(
                            { label: '側面(曲面)', dir: sideDir, target: sideFacePt, targets: [sideFacePt], color: '#4f46e5', bg: '#e0e7ff', textCol: '#3730a3' }
                        );
                    } else if (s.type === 'cone') {
                        let bestIdx = 0;
                        let bestVal = -Infinity;
                        bottomPts.forEach((p, i) => {
                            const val = p.x * sideDir;
                            if (val > bestVal) {
                                bestVal = val;
                                bestIdx = i;
                            }
                        });
                        highlightVertices.push(apexPt);
                        const botCenter = projectShape3D(s, 0, bottomY, 0);
                        const sideFacePt = {
                            x: apexPt.x * 0.35 + bottomPts[bestIdx].x * 0.48 + botCenter.x * 0.17,
                            y: apexPt.y * 0.35 + bottomPts[bestIdx].y * 0.65
                        };
                        callouts.push(
                            { label: '頂點', dir: sideDir, target: apexPt, targets: [apexPt], color: '#d97706', bg: '#fef3c7', textCol: '#92400e' },
                            { label: '側面(曲面)', dir: sideDir, target: sideFacePt, targets: [sideFacePt], color: '#4f46e5', bg: '#e0e7ff', textCol: '#3730a3' }
                        );
                    }

                    // 依左右側分組並按目標點 Y 排序，確保同側標籤之間至少間隔 38px 不重疊
                    [-1, 1].forEach((d) => {
                        const group = callouts.filter(c => c.dir === d);
                        group.sort((a, b) => a.target.y - b.target.y);
                        group.forEach((c, idx) => {
                            c.labelY = idx === 0 ? c.target.y : Math.max(c.target.y, group[idx - 1].labelY + 38);
                        });
                    });

                    return (
                        <g key={`annot-${s.id}`} className="pointer-events-none select-none">
                            {/* 形體名稱置於 2D 投影邊界最下方外側，絕不遮擋形體任何面與點選 */}
                            {shapeLabel && (
                                <g>
                                    <rect x={centerX - 32} y={maxY + 12} width="64" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#6366f1" strokeWidth="1.5" />
                                    <text x={centerX} y={maxY + 24} fill="#ffffff" fontSize="12" fontWeight="bold" textAnchor="middle" dominantBaseline="central">
                                        {shapeLabel}
                                    </text>
                                </g>
                            )}
                            {/* 標示出的邊高亮線段（含上底的邊、側邊、下底的邊） */}
                            {highlightEdges.map((edge, eIdx) => (
                                <line
                                    key={`hedge-${s.id}-${eIdx}`}
                                    x1={edge[0].x}
                                    y1={edge[0].y}
                                    x2={edge[1].x}
                                    y2={edge[1].y}
                                    stroke="#10b981"
                                    strokeWidth="3.5"
                                    strokeLinecap="round"
                                />
                            ))}
                            {/* 標示出的頂點圓點（含上底頂點/錐頂與下底頂點） */}
                            {highlightVertices.map((vPt, vIdx) => (
                                <circle
                                    key={`hvert-${s.id}-${vIdx}`}
                                    cx={vPt.x}
                                    cy={vPt.y}
                                    r="5"
                                    fill="#f59e0b"
                                    stroke="#ffffff"
                                    strokeWidth="1.5"
                                />
                            ))}
                            {/* 各部位側邊箭頭與文字標籤（支援一對多箭頭同時指向上底邊、側邊、下底邊） */}
                            {callouts.map((c, idx) => {
                                const boxW = c.label.length > 2 ? 72 : 46;
                                const boxH = 22;
                                const cDir = c.dir || sideDir;
                                const startX = cDir === 1 ? maxX + 38 : minX - 38;
                                const startY = c.labelY;
                                const boxX = cDir === 1 ? startX : startX - boxW;
                                const targetList = c.targets || [c.target];

                                return (
                                    <g key={`callout-${s.id}-${idx}`}>
                                        {targetList.map((tPt, tIdx) => {
                                            const endX = tPt.x;
                                            const endY = tPt.y;
                                            const dx = endX - startX;
                                            const dy = endY - startY;
                                            const len = Math.hypot(dx, dy) || 1;
                                            const ux = dx / len;
                                            const uy = dy / len;
                                            const px = -uy;
                                            const py = ux;

                                            const tipX = endX - ux * 3;
                                            const tipY = endY - uy * 3;
                                            const b1x = tipX - ux * 8 + px * 4.5;
                                            const b1y = tipY - uy * 8 + py * 4.5;
                                            const b2x = tipX - ux * 8 - px * 4.5;
                                            const b2y = tipY - uy * 8 - py * 4.5;

                                            return (
                                                <g key={`arrow-${s.id}-${idx}-${tIdx}`}>
                                                    <line
                                                        x1={startX}
                                                        y1={startY}
                                                        x2={tipX - ux * 5}
                                                        y2={tipY - uy * 5}
                                                        stroke={c.color}
                                                        strokeWidth="2"
                                                    />
                                                    <polygon
                                                        points={`${tipX},${tipY} ${b1x},${b1y} ${b2x},${b2y}`}
                                                        fill={c.color}
                                                    />
                                                </g>
                                            );
                                        })}
                                        <rect
                                            x={boxX}
                                            y={startY - boxH / 2}
                                            width={boxW}
                                            height={boxH}
                                            rx="6"
                                            fill={c.bg}
                                            stroke={c.color}
                                            strokeWidth="1.5"
                                        />
                                        <text
                                            x={boxX + boxW / 2}
                                            y={startY}
                                            fill={c.textCol}
                                            fontSize="11.5"
                                            fontWeight="bold"
                                            textAnchor="middle"
                                            dominantBaseline="central"
                                        >
                                            {c.label}
                                        </text>
                                    </g>
                                );
                            })}
                        </g>
                    );
                });
            };

            // 繪製座標軸 (Axes)
            const renderAxes = () => {
                const origin = project3D(0, 0, 0);
                const xAxis = project3D(2000, 0, 0); // X 軸延伸
                const zAxis = project3D(0, 0, 2000); // Z 軸延伸
                
                return (
                    <g className="pointer-events-none opacity-30">
                        <line x1={origin.x} y1={origin.y} x2={xAxis.x} y2={xAxis.y} stroke="red" strokeWidth="2" strokeDasharray="5,5" />
                        <text x={xAxis.x} y={xAxis.y} fill="red" fontSize="12" fontWeight="bold">X</text>
                        
                        <line x1={origin.x} y1={origin.y} x2={zAxis.x} y2={zAxis.y} stroke="blue" strokeWidth="2" strokeDasharray="5,5" />
                        <text x={zAxis.x} y={zAxis.y} fill="blue" fontSize="12" fontWeight="bold">Z</text>
                        
                        <circle cx={origin.x} cy={origin.y} r="3" fill="#333" />
                    </g>
                );
            };

            // 導覽跳轉邏輯 (支援回首頁與跨關卡切換，遵守破關解鎖限制)
            const handleNavigate = (val) => {
                const isFromMobile = sessionStorage.getItem('geo_mode') === 'mobile' || document.referrer.includes('mobile.html');
                const homeUrl = isFromMobile ? '../mobile.html' : '../index.html';
                const quizUrl = isFromMobile ? '../mobile.html#quizCard' : '../index.html';

                // 解鎖狀態檢核
                const isS2Unlocked = progress.done.includes('s1');
                const isS3Unlocked = progress.done.includes('s2');
                const isQuizUnlocked = progress.done.includes('s1') && progress.done.includes('s2') && progress.done.includes('s3');

                if (val === 'home') {
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'NAVIGATE_HOME' }, '*'); } catch(e) {}
                    }
                    window.location.href = homeUrl;
                } else if (val === 'quiz') {
                    if (!isQuizUnlocked) {
                        alert('🔒 尚未解鎖！請依序通過第 1、2、3 關檢核挑戰後才能進行總測驗！');
                        return;
                    }
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'NAVIGATE_STEP', stepId: 'quiz' }, '*'); } catch(e) {}
                    }
                    window.location.href = quizUrl;
                } else if (val === 's2') {
                    if (!isS2Unlocked) {
                        alert('🔒 尚未解鎖！請先完成第 1 關的底面與表面特性檢核任務才能前往第 2 關！');
                        return;
                    }
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'NAVIGATE_STEP', stepId: 's2' }, '*'); } catch(e) {}
                    }
                    window.location.href = 'geometry_shapes.html';
                } else if (val === 's3') {
                    if (!isS3Unlocked) {
                        alert('🔒 尚未解鎖！請先依序完成第 1 關與第 2 關才能前往第 3 關！');
                        return;
                    }
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'NAVIGATE_STEP', stepId: 's3' }, '*'); } catch(e) {}
                    }
                    window.location.href = 'interactive_sphere.html';
                }
            };

            const isS2Unlocked = progress.done.includes('s1');
            const isS3Unlocked = progress.done.includes('s2');
            const isQuizUnlocked = progress.done.includes('s1') && progress.done.includes('s2') && progress.done.includes('s3');

            return (
                <div className={`${isFullscreen ? "fixed inset-0 z-50 w-screen h-[100dvh]" : "w-full h-[100dvh]"} flex flex-col bg-slate-950 overflow-hidden font-sans select-none`}>
                    {/* --- 頂部固定工具列 (單行防換行，適配 iPad 橫向/直向與手機) --- */}
                    <header 
                        style={{ paddingTop: 'max(8px, env(safe-area-inset-top, 8px))', paddingBottom: '6px' }} 
                        className="bg-slate-900 border-b border-slate-800 px-2 sm:px-3 flex flex-nowrap items-center justify-between gap-1 sm:gap-2 text-white z-30 shrink-0 min-h-[48px]"
                    >
                        {/* 左側：關卡標題 */}
                        <div className="flex items-center gap-1.5 text-slate-200 font-extrabold text-xs sm:text-sm shrink-0">
                            <span>🧊</span>
                            <span>3D 立體圖形實驗室</span>
                        </div>

                        {/* 中間：關卡快速切換 下拉選單 (破關解鎖狀態同步顯示) */}
                        <div className="flex items-center bg-slate-800/95 border border-indigo-500/70 rounded-lg px-1.5 sm:px-2 py-1 shadow-sm shrink-0">
                            <select
                                value="s1"
                                onChange={(e) => handleNavigate(e.target.value)}
                                className="bg-transparent text-amber-300 font-bold text-xs sm:text-sm focus:outline-none cursor-pointer pr-1 max-w-[125px] sm:max-w-none"
                                id="levelNavSelect"
                            >
                                <option value="home" className="bg-slate-800 text-amber-300 font-bold">🏠 學習地圖</option>
                                <option value="s1" className="bg-slate-800 text-white font-bold">📍 關卡 1 (目前)</option>
                                <option value="s2" className="bg-slate-800 text-white">{isS2Unlocked ? "關卡 2：展開圖" : "🔒 關卡 2 (需破關)"}</option>
                                <option value="s3" className="bg-slate-800 text-white">{isS3Unlocked ? "關卡 3：球體" : "🔒 關卡 3 (需破關)"}</option>
                                <option value="quiz" className="bg-slate-800 text-yellow-300">{isQuizUnlocked ? "★ 總測驗" : "🔒 ★ 總測驗"}</option>
                            </select>
                        </div>

                        {/* 右側：重置視角、檢核開關、全螢幕 */}
                        <div className="flex items-center gap-1 sm:gap-1.5 shrink-0">
                            <button 
                                onClick={resetView} 
                                className="px-1.5 sm:px-2 py-1 bg-slate-800 border border-slate-700 text-slate-300 hover:text-white rounded-lg text-xs font-bold transition-colors whitespace-nowrap"
                                title="重置視角"
                            >
                                ↺ <span className="hidden sm:inline">重置</span>
                            </button>

                            {/* 頂部檢核任務切換按鈕 */}
                            <button 
                                onClick={() => setQuizOpen(!quizOpen)} 
                                className={`px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-md whitespace-nowrap ${quizOpen ? "bg-purple-600 text-white ring-2 ring-purple-300" : "bg-purple-700/80 text-purple-100 hover:bg-purple-600"}`}
                                id="toggleQuizBtn"
                            >
