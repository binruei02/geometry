                                            key={s.id}
                                            onClick={() => setSelectedShapeId(s.id)}
                                            className={`px-2 py-0.5 rounded text-[11px] font-bold border transition-colors ${selectedShapeId === s.id ? "bg-indigo-600 text-white border-indigo-600" : "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200"}`}
                                        >
                                            {SHAPE_NAMES[s.type]} {idx + 1}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* 手機端浮動展開按鈕 (置於左上角，避免與底部視角工具列重疊，且明確標示新增形體與參數控制) */}
                        <button
                            onClick={() => setSidebarOpen(true)}
                            className={`${sidebarOpen ? "hidden" : "flex md:hidden"} absolute top-3 left-3 z-20 px-3 py-2 bg-indigo-600/95 hover:bg-indigo-500 text-white border border-indigo-400 rounded-xl text-xs font-bold shadow-xl items-center gap-1.5 backdrop-blur-md transition-all active:scale-95`}
                            title="開啟新增形體與參數控制面板"
                        >
                            <span>➕ 新增形體 / ⚙️ 參數控制</span>
                        </button>

                        {/* 右側：3D 畫布與底部觸控輔助 (清爽高對比幾何格紙背景，清晰呈現形體顏色與邊線) */}
                        <div className="flex-1 relative bg-slate-100 overflow-hidden flex flex-col">
                            <svg 
                                ref={svgRef}
                                viewBox="0 0 800 600" 
                                className={`w-full h-full bg-slate-100 touch-none ${cursorClass}`}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                onWheel={handleWheel}
                                onTouchStart={handleTouchStart}
                                onTouchMove={handleTouchMove}
                                onTouchEnd={handleTouchEnd}
                            >
                                <defs>
                                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" strokeWidth="0.8"/>
                                    </pattern>
                                </defs>
                                
                                <g transform={`translate(${view.x}, ${view.y}) translate(${CX}, ${CY}) scale(${view.scale}) translate(${-CX}, ${-CY})`}>
                                    {/* 地板網格 */}
                                    <rect x="-4000" y="-4000" width="8000" height="8000" fill="url(#grid)" />
                                    {renderAxes()}
                                    
                                    {/* 渲染場景 */}
                                    {renderScene()}

                                    {/* 形體側邊部位箭頭標註 (頂點、邊、側面) */}
                                    {renderAnnotations()}
                                </g>
                            </svg>

                            {/* --- 直覺操作列 + 貼心操作提示 (置底浮動卡片，適配 iOS Safari 全螢幕與 Safe Area，橫向捲動絕不消失) --- */}
                            <div 
                                style={{ bottom: 'max(12px, env(safe-area-inset-bottom, 12px))' }}
                                className="absolute left-2 right-2 sm:left-3 sm:right-3 z-30 flex flex-col items-center gap-1.5 pointer-events-none"
                            >
                                {/* iPad / 手機貼心操作提示 */}
                                <div className="pointer-events-auto bg-slate-900/90 text-amber-300 font-bold px-3 py-1 rounded-xl shadow-lg border border-slate-700 text-[11px] sm:text-xs flex items-center gap-1.5 backdrop-blur-md">
                                    {interactionMode === 'moveItem' ? (
                                        <span>✋ 拖曳位置模式：直接點選形體並用手指或滑鼠拖動位置（也可點「均勻排列」自動排好）</span>
                                    ) : (
                                        <span>🔄 旋轉物件模式：點選形體後「上下拖拉」上下旋轉、「左右拖拉」左右旋轉</span>
                                    )}
                                </div>

                                {/* 單行橫向捲動操作列 */}
                                <div className="w-full flex items-center justify-center pointer-events-none max-w-full relative px-2">
                                    <div className="pointer-events-auto flex items-center gap-1.5 max-w-full w-full justify-center">
                                        <div 
                                            id="shapeToolbar" 
                                            ref={toolbarRef}
                                            onScroll={checkToolbarScroll}
                                            className="flex items-center gap-1.5 sm:gap-2 bg-slate-900/95 backdrop-blur-md px-2.5 sm:px-3 py-1.5 rounded-2xl shadow-2xl border border-slate-700 text-white min-w-0 overflow-x-auto no-scrollbar scroll-smooth"
                                        >
                                            <button
                                                onClick={() => setCameraPreset("top")}
                                                className="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1 transition-all whitespace-nowrap shrink-0"
                                                title="一鍵俯視，清楚點選上底面"
                                                id="btnLookTop"
                                            >
                                                👀 看上底
                                            </button>
                                            <button
                                                onClick={() => setCameraPreset("bottom")}
                                                className="px-2.5 py-1.5 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1 transition-all whitespace-nowrap shrink-0"
                                                title="一鍵仰視，清楚點選下底面"
                                                id="btnLookBottom"
                                            >
                                                👀 看下底
                                            </button>

                                            <div className="h-5 w-px bg-slate-700 shrink-0 mx-0.5" />

                                            <button
                                                onClick={() => setInteractionMode("moveItem")}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 whitespace-nowrap shrink-0 ${
                                                    interactionMode === "moveItem"
                                                        ? "bg-indigo-600 text-white ring-2 ring-indigo-300"
                                                        : "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                                                }`}
                                                title="選取物件後，以手指或滑鼠直接拖動物件位置"
                                                id="btnDragPos"
                                            >
                                                ✋ 拖曳位置
                                            </button>
                                            <button
                                                onClick={() => setInteractionMode("rotate")}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 whitespace-nowrap shrink-0 ${
                                                    interactionMode === "rotate"
                                                        ? "bg-indigo-600 text-white ring-2 ring-indigo-300"
                                                        : "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                                                }`}
                                                title="點選物件後，上下拖拉可上下旋轉物件，左右拖拉可左右旋轉物件"
                                                id="btnRotateObj"
                                            >
                                                🔄 旋轉物件
                                            </button>
                                            <button
                                                onClick={arrangeShapes}
                                                className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1 transition-all whitespace-nowrap shrink-0"
                                                title="依據目前畫面上的形體數量，自動均勻排列在畫面上"
                                                id="btnArrangeEvenly"
                                            >
                                                📐 均勻排列
                                            </button>
                                        </div>

                                        {/* 常駐最右側的「滑動更多 ❯」引導按鈕：一開始即可看到！ */}
                                        {(toolbarCanScrollRight || toolbarCanScrollLeft) && (
                                            <button
                                                onClick={() => {
                                                    const el = toolbarRef.current;
                                                    if (!el) return;
                                                    if (toolbarCanScrollRight) {
                                                        el.scrollBy({ left: 160, behavior: 'smooth' });
                                                    } else {
                                                        el.scrollTo({ left: 0, behavior: 'smooth' });
                                                    }
                                                }}
                                                className={`shrink-0 flex items-center gap-1 px-2.5 py-2 rounded-2xl text-xs font-black shadow-xl border transition-all cursor-pointer whitespace-nowrap active:scale-95 ${
                                                    toolbarCanScrollRight
                                                        ? "bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 border-amber-300 animate-pulse"
                                                        : "bg-slate-800 hover:bg-slate-700 text-amber-300 border-slate-600"
                                                }`}
                                                title={toolbarCanScrollRight ? "向右滑動查看微調與自轉等更多工具" : "點擊滑回開頭"}
                                            >
                                                {toolbarCanScrollRight ? (
                                                    <>
                                                        <span>滑動更多</span>
                                                        <span>❯</span>
                                                    </>
                                                ) : (
                                                    <>
                                                        <span>❮</span>
                                                        <span>回前</span>
                                                    </>
                                                )}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GeometryLab />);
    </script>
</body>
</html>
