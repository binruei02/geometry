<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="幾何形體任你玩">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>window.APP_ASSETS_PATH = "";</script>
    <script src="app-mode.js"></script>
    <title>互動式球體幾何教學 (Interactive Sphere Geometry)</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #f0f0f0;
            touch-action: none; /* 防止手機瀏覽器的預設滑動行為 */
        }

        
        /* 觸控友善的滑動條容器 */
        #slider-container {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border: 1px solid rgba(226, 232, 240, 0.8);
            z-index: 20;
            text-align: center;
        }

        #slider-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #334155;
            font-weight: bold;
        }

        /* 自定義 Range Input */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 26px;
            width: 26px;
            border-radius: 50%;
            background: #0284c7;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        input[type=range]::-moz-range-thumb {
            height: 26px;
            width: 26px;
            border-radius: 50%;
            background: #0284c7;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .lil-gui { display: none !important; }

        /* 3D 空間標籤樣式 (高對比度、圓角微光標籤) */
        .label {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.22);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.15s ease;
        }
        .label-center {
            background: rgba(245, 158, 11, 0.95);
            color: #ffffff;
            border: 1px solid #d97706;
        }
        .label-diameter {
            background: rgba(239, 68, 68, 0.95);
            color: #ffffff;
            border: 1px solid #dc2626;
        }
        .label-section {
            background: rgba(37, 99, 235, 0.95);
            color: #ffffff;
            border: 1px solid #1d4ed8;
        }
        .label-radius {
            background: rgba(51, 65, 85, 0.92);
            color: #ffffff;
            border: 1px solid #1e293b;
        }
        .label-cap {
            background: rgba(14, 165, 233, 0.95);
            color: #ffffff;
            border: 1px solid #0284c7;
        }
        .label-cap.highlight {
            background: rgba(16, 185, 129, 0.96);
            color: #ffffff;
            border: 1px solid #059669;
            font-size: 12px;
        }

        /* 題目選項按鈕與回饋樣式 */
        .hud-options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }
        .hud-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }
        .hud-btn:hover { background: #f0f9ff; border-color: #38bdf8; }
        .hud-feedback-bar {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            line-height: 1.4;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hud-feedback-bar.show { display: flex; }
        .hud-feedback-bar.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .hud-feedback-bar.err { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
        .hud-action-btn {
            padding: 6px 14px;
            background: linear-gradient(90deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(124,58,237,0.3);
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .hud-action-btn:active { transform: scale(0.96); }

        /* 手機端空間極致節省與防捲動優化 */
        @media (max-width: 640px) {
            #sphere-topbar {
                padding-left: 6px !important;
                padding-right: 6px !important;
                gap: 4px !important;
            }
            .sphere-title-text { display: none; }
            #btn-reset-view { padding: 4px 6px !important; font-size: 10px !important; }
            #levelNavWrapper { max-width: 130px !important; }
            #levelNavSelect { font-size: 11px !important; max-width: 120px !important; }
            #hud-toggle-btn { padding: 4px 6px !important; font-size: 11px !important; }
            .hud-sub-text { display: none; }
            #btn-fullscreen { padding: 4px 6px !important; }
            #fs-text { display: none; }
            #sphere-side-info {
                max-width: 200px !important;
                font-size: 11px !important;
                padding: 8px 10px !important;
                left: 8px !important;
            }
            #slider-container {
                width: calc(100% - 24px) !important;
                padding: 6px 12px !important;
                bottom: max(12px, env(safe-area-inset-bottom, 12px)) !important;
            }
            #slider-label { font-size: 0.78rem !important; margin-bottom: 2px !important; }
        }
    </style>
</head>
<body>

    <div id="loading">載入 3D 引擎中...<br>Loading 3D Engine...</div>
    
    <!-- 頂部固定導航列 (單行防換行，適配手機直向/橫向與 iPad) -->
    <header id="sphere-topbar" style="position:fixed; top:0; left:0; width:100%; min-height:48px; padding-top:max(8px, env(safe-area-inset-top, 8px)); padding-bottom:6px; padding-left:10px; padding-right:10px; background:rgba(15, 23, 42, 0.95); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid rgba(51, 65, 85, 0.8); display:flex; flex-wrap:nowrap; justify-content:space-between; align-items:center; box-sizing:border-box; z-index:100; color:white; font-family:sans-serif; gap:8px; overflow-x:hidden;">
        <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
            <span style="font-weight:bold; font-size:13px; color:#e2e8f0; display:flex; align-items:center; gap:5px; white-space:nowrap;">
                <span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:#38bdf8;"></span>
                <span class="sphere-title-text">認識</span>球體
            </span>
            <button id="btn-reset-view" style="padding:4px 8px; background:#1e293b; border:1px solid #334155; color:#cbd5e1; font-size:11px; font-weight:bold; border-radius:6px; cursor:pointer; white-space:nowrap;" title="重置視角">
                ↺ 重置
            </button>
        </div>

        <!-- 中間：關卡快速切換 下拉選單 -->
        <div id="levelNavWrapper" style="display:flex; align-items:center; background:rgba(30, 41, 59, 0.95); border:1px solid rgba(139, 92, 246, 0.7); border-radius:8px; padding:3px 6px; box-shadow:0 1px 4px rgba(0,0,0,0.2); flex-shrink:1; min-width:0; max-width:180px;">
            <select id="levelNavSelect" style="background:transparent; color:#fbbf24; font-size:12px; font-weight:bold; border:none; outline:none; cursor:pointer; width:100%; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                <option value="home" style="background:#1e293b; color:#fbbf24; font-weight:bold;">🏠 回學習地圖</option>
                <option value="s1" style="background:#1e293b; color:white;">關卡 1：認識柱與錐</option>
                <option value="s2" style="background:#1e293b; color:white;">關卡 2：展開圖與組合</option>
                <option value="s3" style="background:#1e293b; color:white; font-weight:bold;" selected>📍 關卡 3：球體 (目前)</option>
                <option value="quiz" style="background:#1e293b; color:#fde047;">★ 總測驗挑戰</option>
            </select>
        </div>

        <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
            <button id="hud-toggle-btn" style="background:#7c3aed; color:white; border:none; padding:5px 8px; border-radius:8px; font-weight:bold; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px; box-shadow:0 2px 8px rgba(124,58,237,0.4); white-space:nowrap;">
                <span>🎯 檢核 <span class="hud-sub-text">(</span><span id="top-step-num">1/3</span><span class="hud-sub-text">)</span></span>
                <span id="top-toggle-text">▼</span>
            </button>
            <button id="btn-fullscreen" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:5px 8px; border-radius:8px; font-weight:bold; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap;" title="全螢幕檢視">
                <span id="fs-icon">⛶</span>
                <span id="fs-text">全螢幕</span>
            </button>
        </div>
    </header>

    <!-- 頂部折疊式檢核任務面板 (HUD) -->
    <div id="sphere-quiz-hud" style="position:fixed; top:calc(42px + max(8px, env(safe-area-inset-top, 8px))); left:0; width:100%; max-height:38vh; overflow-y:auto; background:rgba(255, 255, 255, 0.98); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:2px solid #8b5cf6; padding:10px 14px; box-shadow:0 12px 30px rgba(0,0,0,0.2); z-index:90; box-sizing:border-box; display:none;">
        <div style="max-width:800px; margin:0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #ede9fe; flex-wrap:wrap; gap:6px;">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="background:#7c3aed; color:white; font-size:11px; padding:2px 8px; border-radius:99px; font-weight:bold;">第 3 關檢核</span>
                    <span style="font-size:12px; color:#6d28d9; font-weight:bold;">邊操作邊回答：<span id="hud-step-indicator">題 1 / 3</span></span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                    <div style="display:flex; gap:4px;">
                        <button class="step-nav-btn" data-step="0" style="padding:2px 8px; font-size:11px; font-weight:bold; border-radius:6px; border:1px solid #cbd5e1; background:#7c3aed; color:white; cursor:pointer;">1. 球心半徑</button>
                        <button class="step-nav-btn" data-step="1" style="padding:2px 8px; font-size:11px; font-weight:bold; border-radius:6px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; cursor:pointer;">2. 平面切面</button>
                        <button class="step-nav-btn" data-step="2" style="padding:2px 8px; font-size:11px; font-weight:bold; border-radius:6px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; cursor:pointer;">3. 最大大圓</button>
                    </div>
                    <button id="hud-close-btn" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#475569; cursor:pointer; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:6px;">▲ 收合題目</button>
                </div>
            </div>
            <div id="hud-content"></div>
        </div>
    </div>

    <!-- 左側操作與特性浮動說明卡片 (避免擋住中央 3D 球體) -->
    <div id="sphere-side-info" style="position:fixed; top:calc(56px + max(10px, env(safe-area-inset-top, 24px))); left:16px; width:220px; background:rgba(255, 255, 255, 0.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:14px; border:1px solid rgba(226, 232, 240, 0.9); box-shadow:0 8px 24px rgba(0,0,0,0.1); padding:12px; z-index:20; font-size:12px; color:#334155; line-height:1.5; pointer-events:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:bold; color:#0f172a; border-bottom:1px solid #f1f5f9; padding-bottom:4px;">
            <span>💡 操作與特性</span>
            <button id="btn-collapse-info" style="border:none; background:#f1f5f9; color:#475569; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px; font-weight:bold;">收合 ▲</button>
        </div>
        <div id="side-info-body">
            <div style="margin-bottom:8px;">
                <b style="color:#0284c7;">🎯 互動手勢：</b><br>
                • 拖曳 <span style="color:#ef4444; font-weight:bold;">● 紅點</span>：調整球半徑<br>
                • 拖曳 <span style="color:#3b82f6; font-weight:bold;">● 藍點</span>：旋轉切面半徑<br>
                • 單指滑動：360° 旋轉視角<br>
                • 雙指撥動：縮放畫面
            </div>
            <div style="border-top:1px dashed #e2e8f0; padding-top:6px;">
                <b style="color:#0284c7;">📐 球體特性：</b><br>
                • 球心到球面每一點距離都<b>相等</b>（半徑）<br>
                • <b>直徑 = 半徑 × 2</b><br>
                • 任何平面切過球體，切面皆為<b>圓形</b><br>
                • 通過球心的切面最大，稱為<b>大圓</b>
            </div>
        </div>
    </div>

    <!-- 底部觸控滑動條 -->
    <div id="slider-container">
        <label id="slider-label" for="clip-slider">移動切割面位置 (Move Cut Position)</label>
        <input type="range" id="clip-slider" min="-5" max="5" step="0.01" value="0">
    </div>

    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';

        // --- 全域變數 ---
        let camera, scene, renderer, labelRenderer;
        let controls, viewHelper;
        let sphere, capMesh;
        let centerLabel, radiusLabel, capLabel, diameterLabel, sectionRadiusLabel;
        let radiusLine, diameterLine, sectionRadiusLine, diameterOppositeHandle;
        let radiusHandle, sectionHandle; 
        let raycaster, pointer;
        let draggedObject = null; 
        
        // 幾何常數
        const R = 5; // 球體半徑
        const CLIP_PLANE_NORMAL = new THREE.Vector3(-1, 0, 0); // 切割面法向量 (垂直 X 軸)
        
        // 互動狀態
        const state = {
            clipPosition: 0, // 切割位置 d (-5 ~ 5)
            sectionRadius: R // 當前剖面半徑 r
        };

        init();
        animate();

        function init() {
            // 1. 場景設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f7); 

            // 2. 攝影機
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(10, 10, 15);

            // 3. 渲染器 (WebGL)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.localClippingEnabled = true; 
            renderer.shadowMap.enabled = true;
            renderer.autoClear = false; 
            document.body.appendChild(renderer.domElement);

            // 4. 渲染器 (CSS2D)
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none'; 
            document.body.appendChild(labelRenderer.domElement);

            // 5. 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 6. 視角輔助工具
            viewHelper = new ViewHelper(camera, renderer.domElement);
            viewHelper.position.set(0.8, -0.8, 0); 
            viewHelper.scale.set(0.6, 0.6, 0.6); 

            // 7. 燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const backLight = new THREE.DirectionalLight(0xaaccff, 1.0);
            backLight.position.set(-10, -10, -10);
            scene.add(backLight);

            // --- 核心幾何物件建構 ---
            buildSceneObjects();
            
            // --- 互動機制 ---
            setupInteraction();
            
            // --- UI 介面 ---
            setupUI();

            // 移除 Loading
            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').remove(), 500);
            
            // 視窗響應
            window.addEventListener('resize', onWindowResize);
        }

        function buildSceneObjects() {
            // A. 主要球體
            const geometry = new THREE.SphereGeometry(R, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0.0,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 0.0,
                ior: 1.2, 
                iridescence: 1.0, 
                iridescenceIOR: 1.3,
                iridescenceThicknessRange: [100, 400], 
                clearcoat: 1.0, 
                clearcoatRoughness: 0.0,
                side: THREE.DoubleSide, 
                transparent: true
            });

            sphere = new THREE.Mesh(geometry, material);
            const localPlane = new THREE.Plane(CLIP_PLANE_NORMAL, 0);
            sphere.material.clippingPlanes = [localPlane];
            scene.add(sphere);

            // B. 剖面蓋子
            const capGeometry = new THREE.CircleGeometry(R, 64);
            const capMaterial = new THREE.MeshBasicMaterial({
                color: 0x88ccff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5
            });
            capMesh = new THREE.Mesh(capGeometry, capMaterial);
            capMesh.rotation.y = -Math.PI / 2;
            scene.add(capMesh);

            // C. 球心 (Yellow/Orange)
            const centerGeo = new THREE.SphereGeometry(0.18, 16, 16);
            const centerMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const centerMesh = new THREE.Mesh(centerGeo, centerMat);
            scene.add(centerMesh);
            
            // 指定類別: label-center，微往鏡頭前上方微調避免遮擋線條
            centerLabel = createLabel("球心 (Center)", new THREE.Vector3(0, 0.35, 0.35), "label-center");
            scene.add(centerLabel);

            // D. 直徑 (呈現在最大圓切面 / 剖面上，穿過球心與半徑相連，直徑 = 半徑 × 2)
            const diameterPoints = [new THREE.Vector3(0, -R, 0), new THREE.Vector3(0, R, 0)];
            const diameterGeo = new THREE.BufferGeometry().setFromPoints(diameterPoints);
            const diameterMat = new THREE.LineDashedMaterial({
                color: 0xef4444,
                dashSize: 0.35,
                gapSize: 0.15,
                linewidth: 3.5
            });
            diameterLine = new THREE.Line(diameterGeo, diameterMat);
            diameterLine.computeLineDistances();
            diameterLine.renderOrder = 2;
            scene.add(diameterLine);

            // 直徑反向端點節點 (與半徑端點藍點形成完整直徑的兩端)
            const oppGeo = new THREE.SphereGeometry(0.24, 24, 24);
            const oppMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x660000 });
            diameterOppositeHandle = new THREE.Mesh(oppGeo, oppMat);
            diameterOppositeHandle.position.set(0, -R, 0);
            scene.add(diameterOppositeHandle);
            
            // 指定類別: label-diameter，放置在反向半徑的中點，直觀呈現兩倍關係
            diameterLabel = createLabel(`直徑 (Diameter) = ${(2 * R).toFixed(1)} (半徑 × 2)`, new THREE.Vector3(0, -R / 2, 0), "label-diameter");
            scene.add(diameterLabel);

            // E. 互動半徑 (球面紅色，置於左前側弧面上，避免與大圓剖面上的半徑/直徑標籤重疊)
            const initPos = new THREE.Vector3(-0.85, -0.2, 0.48).normalize().multiplyScalar(R);
            
            // 1. 手柄
            const handleGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
            radiusHandle = new THREE.Mesh(handleGeo, handleMat);
            radiusHandle.position.copy(initPos);
            radiusHandle.userData.isHandle = true;
            scene.add(radiusHandle);

            // 2. 線條
            const radiusPoints = [new THREE.Vector3(0, 0, 0), initPos];
            const radiusLineGeo = new THREE.BufferGeometry().setFromPoints(radiusPoints);
            const radiusLineMat = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 2 });
            radiusLine = new THREE.Line(radiusLineGeo, radiusLineMat);
            scene.add(radiusLine);

            // 3. 標籤 - 指定類別: label-radius
            radiusLabel = createLabel(`球體半徑 (Radius) R = ${R.toFixed(1)}`, new THREE.Vector3().copy(initPos).multiplyScalar(0.5), "label-radius");
            scene.add(radiusLabel);
            
            // F. 剖面互動半徑 (剖面藍色)
            const sectionHandleGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const sectionHandleMat = new THREE.MeshStandardMaterial({ color: 0x0000ff, emissive: 0x000055 });
            sectionHandle = new THREE.Mesh(sectionHandleGeo, sectionHandleMat);
            sectionHandle.position.set(0, R, 0);
            sectionHandle.userData.isSectionHandle = true;
            scene.add(sectionHandle);

            const secRadPoints = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, R, 0)];
            const secRadGeo = new THREE.BufferGeometry().setFromPoints(secRadPoints);
            const secRadMat = new THREE.LineBasicMaterial({ 
                color: 0x0000cc,
                linewidth: 3 
            });
            sectionRadiusLine = new THREE.Line(secRadGeo, secRadMat);
            sectionRadiusLine.renderOrder = 1; 
            scene.add(sectionRadiusLine);

            // 指定類別: label-section
            sectionRadiusLabel = createLabel(`剖面半徑 (Section r) = ${R.toFixed(1)}`, new THREE.Vector3(0, R/2, 0), "label-section");
            scene.add(sectionRadiusLabel);

            // 4. 剖面大標題 - 初始指定類別: label-cap
            capLabel = createLabel("最大剖面 (大圓 Great Circle)", new THREE.Vector3(0, R + 0.8, 0), "label-cap");
            capLabel.element.classList.add('highlight');
            scene.add(capLabel);
        }

        // 修改後的 createLabel，支援傳入自定義 className
        function createLabel(text, position, className = "label-default") {
            const div = document.createElement('div');
            div.className = 'label ' + className;
            div.innerHTML = text.replace(/\n/g, '<br>'); 
            const label = new CSS2DObject(div);
            label.position.copy(position);
            return label;
        }

        function setupUI() {
            const slider = document.getElementById('clip-slider');
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                updateClipping(val);
            });
            updateClipping(0);
        }

        // 更新切割邏輯
        function updateClipping(d) {
            state.clipPosition = d;

            sphere.material.clippingPlanes[0].constant = d;
            capMesh.position.set(d, 0, 0);

            const r_squared = R*R - d*d;

            if (r_squared > 0.001) {
                const r = Math.sqrt(r_squared);
                state.sectionRadius = r;
                capMesh.visible = true;
                capMesh.scale.set(r/R, r/R, 1);
                
                sectionHandle.visible = true;
                sectionRadiusLine.visible = true;
                sectionRadiusLabel.visible = true;

                let angle = Math.atan2(sectionHandle.position.z, sectionHandle.position.y);
                if (isNaN(angle)) angle = Math.PI / 2;

                const newY = r * Math.cos(angle);
                const newZ = r * Math.sin(angle);
                sectionHandle.position.set(d, newY, newZ);

                const positions = sectionRadiusLine.geometry.attributes.position.array;
                positions[0] = d; positions[1] = 0; positions[2] = 0;
                positions[3] = d; positions[4] = newY; positions[5] = newZ;
                sectionRadiusLine.geometry.attributes.position.needsUpdate = true;

                sectionRadiusLabel.element.innerHTML = `剖面半徑 (Section r) = ${r.toFixed(2)}`;
                sectionRadiusLabel.position.set(d, newY / 2, newZ / 2);

                const EPSILON = 0.1;
                const isGreatCircle = Math.abs(d) < EPSILON;
                
                capLabel.position.set(d, r + 0.5, 0);

                if (isGreatCircle) {
                    sectionRadiusLabel.element.innerHTML = `半徑 (Radius) = ${r.toFixed(1)}`;
                } else {
                    sectionRadiusLabel.element.innerHTML = `剖面半徑 (Section r) = ${r.toFixed(2)}`;
                }
                sectionRadiusLabel.position.set(d, newY / 2, newZ / 2);

                // 同步連動直徑線：使其直接呈現在最大圓切面上，並與半徑相連 (直徑 = 半徑 × 2)
                updateDiameterLineAndLabel(d, newY, newZ, r);

                // 移除舊有特定樣式，根據大圓狀態套用新樣式
                capLabel.element.classList.remove('highlight', 'label-cap');
                
                if (isGreatCircle) {
                    capMesh.material.color.set(0x00ff00);
                    capLabel.element.innerHTML = `最大剖面 (大圓 Great Circle)`;
                    capLabel.element.classList.add('highlight'); // 綠色高亮
                    capLabel.visible = true;
                } else {
                    capMesh.material.color.set(0x88ccff);
                    capLabel.element.innerHTML = `剖面圓 (Section Circle)`;
                    capLabel.element.classList.add('label-cap'); // 藍色背景
                    capLabel.visible = true;
                }
            } else {
                state.sectionRadius = 0;
                capMesh.visible = false;
                capLabel.visible = false;
                sectionRadiusLine.visible = false;
                sectionRadiusLabel.visible = false;
                sectionHandle.visible = false;
                updateDiameterLineAndLabel(d, 0, 0, 0);
            }
        }

        // 動態更新直徑線、端點與標籤，確保直徑與半徑共線相連，立即可見 2 倍關係
        function updateDiameterLineAndLabel(d, y, z, r) {
            if (!diameterLine) return;
            if (r <= 0.001) {
                diameterLine.visible = false;
                diameterLabel.visible = false;
                if (diameterOppositeHandle) diameterOppositeHandle.visible = false;
                return;
            }
            diameterLine.visible = true;
            diameterLabel.visible = true;
            if (diameterOppositeHandle) diameterOppositeHandle.visible = true;

            // 直徑另一端點 (反向對稱點)
            if (diameterOppositeHandle) {
                diameterOppositeHandle.position.set(d, -y, -z);
            }

            // 更新直徑線頂點緩衝 (從 -y,-z 穿過 (d,0,0) 至 y,z)
            const pos = diameterLine.geometry.attributes.position.array;
            pos[0] = d; pos[1] = -y; pos[2] = -z;
            pos[3] = d; pos[4] = y; pos[5] = z;
            diameterLine.geometry.attributes.position.needsUpdate = true;
            diameterLine.computeLineDistances();

            const isGreat = Math.abs(d) < 0.1;
            if (isGreat) {
                diameterLabel.element.innerHTML = `直徑 (Diameter) = ${(2 * R).toFixed(1)} (半徑 × 2)`;
            } else {
                diameterLabel.element.innerHTML = `剖面直徑 = ${(2 * r).toFixed(2)}`;
            }
            // 將直徑標籤精準放在反向半徑中點，清楚看出兩段半徑構成一條直徑
            diameterLabel.position.set(d, -y / 2, -z / 2);
        }

        function updateRadiusLineAndLabel() {
            const positions = radiusLine.geometry.attributes.position.array;
            positions[3] = radiusHandle.position.x;
            positions[4] = radiusHandle.position.y;
            positions[5] = radiusHandle.position.z;
            radiusLine.geometry.attributes.position.needsUpdate = true;
            const midPoint = radiusHandle.position.clone().multiplyScalar(0.5);
            radiusLabel.position.copy(midPoint);
        }

        function setupInteraction() {
            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();

            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function onPointerDown(event) {
            updatePointer(event);
            raycaster.setFromCamera(pointer, camera);
            raycaster.params.Line.threshold = 0.5;
            raycaster.params.Points.threshold = 0.5;

            const redIntersects = raycaster.intersectObject(radiusHandle);
            const blueIntersects = raycaster.intersectObject(sectionHandle);

            if (redIntersects.length > 0) {
                draggedObject = 'radius';
                controls.enabled = false;
                radiusHandle.material.emissive.set(0xaa0000);
                // 使用自定義警告樣式，保留背景色
                radiusLabel.element.classList.add('warning'); 
                document.body.style.cursor = 'grabbing';
            } else if (blueIntersects.length > 0 && sectionHandle.visible) {
                draggedObject = 'section';
                controls.enabled = false;
                sectionHandle.material.emissive.set(0x0000aa);
                // 使用自定義高亮樣式，保留背景色
                sectionRadiusLabel.element.classList.add('blue-highlight');
                document.body.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(event) {
            if (!draggedObject) return;

            updatePointer(event);
            raycaster.setFromCamera(pointer, camera);

            // 準備一個備用的虛擬平面 (面向攝影機) 用於當滑鼠移出球體時的投影
            const planeNormal = camera.position.clone().normalize();
            const plane = new THREE.Plane(planeNormal, 0);
            
            if (draggedObject === 'section') {
                plane.normal.set(1, 0, 0);
                plane.constant = -state.clipPosition; 
            }

            // 根據拖曳對象採取不同的策略
            if (draggedObject === 'radius') {
                // 優先檢測球體表面 (Direct Surface Raycast) - 這是最直覺的「點哪去哪」
                const sphereIntersects = raycaster.intersectObject(sphere);
                let target = new THREE.Vector3();
                let found = false;

                if (sphereIntersects.length > 0) {
                    target.copy(sphereIntersects[0].point);
                    found = true;
                } else {
                    // Fallback: 如果沒點到球體 (例如滑鼠移到球外)，則使用平面投影法確保操作連續性
                    raycaster.ray.intersectPlane(plane, target);
                    if (target) {
                        found = true;
                    }
                }

                if (found) {
                    // 正規化到球面上
                    target.normalize().multiplyScalar(R);
                    
                    // 磁吸效果 (Magnetic Snap) - 靠近切割面時吸附
                    if (Math.abs(target.x - state.clipPosition) < 0.25) {
                         target.x = state.clipPosition;
                         // 重新調整 YZ 確保在球面上
                         const currentR = Math.sqrt(target.y*target.y + target.z*target.z);
                         const targetR = Math.sqrt(Math.max(0, R*R - target.x*target.x));
                         if (currentR > 0) {
                             const s = targetR / currentR;
                             target.y *= s;
                             target.z *= s;
                         }
                    }
                    
                    radiusHandle.position.copy(target);
                    updateRadiusLineAndLabel();
                }

            } else if (draggedObject === 'section') {
                // 藍點邏輯維持不變 (在切割面上移動)
                const target = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, target);
                
                if (target) {
                    const localY = target.y;
                    const localZ = target.z;
                    const currentDist = Math.sqrt(localY*localY + localZ*localZ);
                    
                    if (currentDist > 0.0001 && state.sectionRadius > 0) {
                        const scale = state.sectionRadius / currentDist;
                        target.y *= scale;
                        target.z *= scale;
                        target.x = state.clipPosition; 

                        sectionHandle.position.copy(target);

                        const positions = sectionRadiusLine.geometry.attributes.position.array;
                        positions[3] = target.x; positions[4] = target.y; positions[5] = target.z;
                        sectionRadiusLine.geometry.attributes.position.needsUpdate = true;
                        
                        sectionRadiusLabel.position.set(state.clipPosition, target.y/2, target.z/2);
                        updateDiameterLineAndLabel(state.clipPosition, target.y, target.z, state.sectionRadius);
                    }
                }
            }
        }

        function onPointerUp() {
            if (draggedObject) {
                controls.enabled = true;
                document.body.style.cursor = 'auto';

                if (draggedObject === 'radius') {
                    radiusHandle.material.emissive.set(0x550000);
                    // 移除拖曳時的特殊 class
                    radiusLabel.element.classList.remove('warning');
                    radiusLabel.element.innerHTML = `球體半徑 (Radius) R = ${R.toFixed(1)}`;
                } else if (draggedObject === 'section') {
                    sectionHandle.material.emissive.set(0x000055);
                    sectionRadiusLabel.element.classList.remove('blue-highlight');
                }
                
                draggedObject = null;
            }
        }

        function updatePointer(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.clear();
            renderer.render(scene, camera);
            if (viewHelper) viewHelper.render(renderer);
            labelRenderer.render(scene, camera);
        }

        // --- 國小五下：球體小檢核邏輯與 UI 控制 ---

        const levelNavSelect = document.getElementById("levelNavSelect");

            levelNavSelect.onchange = (e) => {

        if (btnCollapseInfo && sideInfoBody) {
            // 手機端預設收合以節省版面，避免遮蔽中央 3D 球體與手勢拖曳

        // 綁定導航按鈕
        document.querySelectorAll(".step-nav-btn").forEach(btn => {
            btn.onclick = () => {

        function renderSphereQuiz() {

                    <p style="font-size:12px; color:#475569; margin:0 0 6px; line-height:1.4;">從球心到球面上任一點的距離都相等，這段長度叫做？直徑與半徑是什麼關係？</p>
                    <div class="hud-options-grid">
                        <button class="hud-btn" data-ans="1">半徑；直徑是半徑的 2 倍 (直徑 = 半徑 × 2)</button>

                    <p style="font-size:12px; color:#475569; margin:0 0 6px; line-height:1.4;">滑動下方「移動切割面」滑桿，從各個位置切切看球體：切口的剖面形狀一定是什麼？</p>

                    <p style="font-size:12px; color:#475569; margin:0 0 6px; line-height:1.4;">把切割面滑桿拉到中間 (切割面位置 = 0)：什麼時候切面的圓形最大？這個大圓的直徑等於球的什麼？</p>

                                    const p = JSON.parse(localStorage.getItem('geo5-progress-v1') || '{"done":[],"best":null}');
                                    if (!p.done.includes("s3")) {
                                        p.done.push("s3");
                                        localStorage.setItem('geo5-progress-v1', JSON.stringify(p));
                                    }
                                    const isFromMobile = sessionStorage.getItem('geo_mode') === 'mobile' || document.referrer.includes('mobile.html');
                                    const homeUrl = isFromMobile ? '../mobile.html' : '../index.html';
                                    if (window.parent && window.parent !== window) {
                                        window.parent.postMessage({ type: "STEP_COMPLETED", stepId: "s3" }, "*");
                                        window.parent.postMessage({ type: "NAVIGATE_HOME" }, "*");
                                    }
                                    window.location.href = homeUrl;
                                } catch(e) {}
                            };
                        }
                    } else {
                        fb.className = "hud-feedback-bar show err";
                        fb.innerHTML = "<span>❌ 再想想看，可以拖曳 3D 球體或移動切割面滑桿觀察看看喔！</span>";
                    }
                };
            });
        }
        renderSphereQuiz();
        updateQuizVisibility();

        // 全螢幕切換功能整合 (支援 iOS Safari 沉浸式模式)
        const btnFs = document.getElementById("btn-fullscreen");
        const fsIcon = document.getElementById("fs-icon");
        const fsText = document.getElementById("fs-text");
        let isPseudoFs = false;

        function isFsActive() {
            const parentDoc = (window.parent && window.parent !== window) ? window.parent.document : null;
            return isPseudoFs || !!(
                document.fullscreenElement || 
                document.webkitFullscreenElement ||
                (parentDoc && (parentDoc.fullscreenElement || parentDoc.webkitFullscreenElement))
            );
        }

        function updateFsButton() {
            const isFs = isFsActive();
            if (fsIcon) fsIcon.textContent = isFs ? "⤓" : "⛶";
            if (fsText) fsText.textContent = isFs ? "縮回視窗" : "全螢幕";
            if (btnFs) {
                if (isFs) {
                    btnFs.style.background = "#334155";
                    btnFs.style.color = "#fde047";
                    btnFs.style.borderColor = "#64748b";
                } else {
                    btnFs.style.background = "#1e293b";
                    btnFs.style.color = "#cbd5e1";
                    btnFs.style.borderColor = "#334155";
                }
            }
        }

        if (btnFs) {
            btnFs.onclick = () => {
                const isFs = isFsActive();
                if (!isFs) {
                    isPseudoFs = true;
                    updateFsButton();
                    try {
                        const el = document.documentElement;
                        const req = el.requestFullscreen || el.webkitRequestFullscreen;
                        if (req) {
                            const p = req.call(el);
                            if (p && p.catch) p.catch(() => {});
                        }
                    } catch(e) {}
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: "ENTER_FULLSCREEN" }, "*");
                        }
                    } catch(e) {}
                    // 在 iOS 瀏覽器中且未安裝為獨立 App，彈出 App 模式引導
                    if (window.isIOSDevice && window.isIOSDevice() && !window.isRunningStandalone()) {
                        window.showAppModeGuide && window.showAppModeGuide('以 App 模式開啟 100% 全螢幕');
                    }
                } else {
                    isPseudoFs = false;
                    updateFsButton();
                    try {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
                            const p = exit.call(document);
                            if (p && p.catch) p.catch(() => {});
                        }
                    } catch(e) {}
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: "EXIT_FULLSCREEN" }, "*");
                        }
                    } catch(e) {}
                }
            };
        }

        document.addEventListener("fullscreenchange", updateFsButton);
        document.addEventListener("webkitfullscreenchange", updateFsButton);
        try {
            window.parent?.document?.addEventListener("fullscreenchange", updateFsButton);
            window.parent?.document?.addEventListener("webkitfullscreenchange", updateFsButton);
        } catch(e) {}
        window.addEventListener("message", (e) => {
            if (e.data && e.data.type === "FULLSCREEN_CHANGED") {
                updateFsButton();
            }
        });
        updateFsButton();
    </script>
</body>
</html>
